version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=jungle
      - POSTGRES_PASSWORD=jungle123
      - POSTGRES_DB=walletdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d walletdb"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=postgres://jungle:jungle123@postgres:5432/walletdb?sslmode=disable
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: start-dev
    ports:
      - "8081:8080" 
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin